name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build Bundles
        run: python scripts/build.py

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/inventer-e16-cards.js
            dist/inventer-e16-schedule-card.js
            dist/inventer-e16-devices-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
