<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#1e3e62" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00adb5" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Airflow Curves -->
  <path d="M -50 80 Q 300 20 600 120 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15" />
  <path d="M -50 140 Q 350 200 700 100 T 1250 180" fill="none" stroke="#00adb5" stroke-width="2.5" opacity="0.18" />
  <path d="M -50 220 Q 400 320 800 180 T 1250 240" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.12" />

  <!-- Left Content: Logo & Titles -->
  <g transform="translate(80, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="225" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="15" r="5" fill="#00adb5" />
    <text x="30" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LOVELACE FRONTEND CARDS</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      inVENTer <tspan fill="url(#accentGrad)">e16 Cards</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
      Interactive Dashboard Cards for inVENTer Easy Connect e16 Ventilation
    </text>

    <!-- Features Pill List -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🗓️ 32 Time Slots</text>

      <rect x="155" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="169" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">📡 Device Management</text>

      <rect x="330" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="344" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">⚡ Dynamic Zones</text>
    </g>
  </g>

  <!-- Right Visual: Cards Graphic Mockup -->
  <g transform="translate(760, 55)" filter="url(#shadow)">
    <!-- Back Card Mockup (Devices Card) -->
    <rect x="60" y="20" width="320" height="210" rx="14" fill="url(#cardBgGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="80" y="42" width="160" height="12" rx="6" fill="#38bdf8" fill-opacity="0.7" />
    <rect x="80" y="66" width="280" height="38" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="102" cy="85" r="10" fill="#22c55e" fill-opacity="0.2" />
    <path d="M 98 85 L 101 88 L 106 82" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="122" y="78" width="90" height="8" rx="4" fill="#cbd5e1" />
    <rect x="122" y="90" width="60" height="6" rx="3" fill="#64748b" />
    <rect x="300" y="80" width="45" height="18" rx="6" fill="#38bdf8" fill-opacity="0.2" />

    <!-- Front Card Mockup (Schedule Card) -->
    <rect x="0" y="50" width="340" height="220" rx="14" fill="#0f172a" stroke="#00adb5" stroke-width="1.8" />
    <!-- Header -->
    <circle cx="28" cy="78" r="8" fill="#00adb5" />
    <path d="M 28 73 V 78 H 32" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <text x="45" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Lüftungszeitplan</text>

    <!-- Profile Selector Pills -->
    <rect x="20" y="102" width="90" height="24" rx="12" fill="#00adb5" />
    <text x="32" y="118" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Wohnzimmer</text>
    <rect x="118" y="102" width="85" height="24" rx="12" fill="#1e293b" />
    <text x="130" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Schlafzimmer</text>
    <rect x="210" y="102" width="60" height="24" rx="12" fill="#1e293b" />
    <text x="222" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Sommer</text>

    <!-- Schedule Matrix Row 1 -->
    <rect x="20" y="140" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="164" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">07:00</text>
    <rect x="85" y="150" width="70" height="20" rx="10" fill="#22c55e" fill-opacity="0.2" />
    <text x="96" y="164" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">WRG Stufe 2</text>
    <text x="175" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Mo Di Mi Do Fr</text>

    <!-- Schedule Matrix Row 2 -->
    <rect x="20" y="190" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="214" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">22:30</text>
    <rect x="85" y="200" width="70" height="20" rx="10" fill="#0284c7" fill-opacity="0.2" />
    <text x="96" y="214" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Lüften Stufe 1</text>
    <text x="175" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Alle Tage</text>

    <!-- Sync status indicator -->
    <circle cx="30" cy="248" r="4" fill="#22c55e" />
    <text x="42" y="252" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Controller synchronized (32/32 slots available)</text>
  </g>
</svg>
